<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="description" content="ACTILC — 2ème Assemblée Générale · 27 décembre 2026 · Franco Hôtel, Yaoundé">
<title>ACTILC — 2ème Assemblée Générale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,700;1,300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
/* ===== RESET & BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#333;background:#FDFCF8;overflow-x:hidden}
:root{--crimson:#8B1A1A;--gold:#C9A96E;--ivory:#FDFCF8;--dark-gold:#B8914A;--light-gold:#E8D5B0}

/* ===== NAVBAR ===== */
#navbar{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .3s,box-shadow .3s;padding:0 20px}
#navbar.scrolled{background:rgba(253,252,248,0.96);backdrop-filter:blur(8px);box-shadow:0 2px 20px rgba(0,0,0,0.06);border-bottom:1px solid #F0E8D0}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:54px;max-width:640px;margin:0 auto}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo-icon{width:28px;height:28px;background:var(--crimson);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:14px;font-family:serif}
.nav-logo-text{font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:300;color:#1A1A1A;letter-spacing:2px}
.nav-links{display:none}
@media(min-width:640px){.nav-links{display:flex;gap:24px}}
.nav-links a{font-size:11px;color:#666;text-decoration:none;letter-spacing:2px;text-transform:uppercase;transition:color .2s}
.nav-links a:hover{color:var(--crimson)}
.nav-right{display:flex;align-items:center;gap:8px}
.lang-btns{display:flex;gap:2px}
.lang-btn{padding:5px 9px;border:1px solid #E0D5C0;background:#fff;font-size:11px;cursor:pointer;color:#888;border-radius:2px;transition:.2s;letter-spacing:1px}
.lang-btn.active{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.hamburger{display:flex;flex-direction:column;gap:4px;cursor:pointer;padding:6px;border:none;background:none}
.hamburger span{display:block;width:18px;height:1.5px;background:#555;transition:.3s}
@media(min-width:640px){.hamburger{display:none}}

/* Mobile menu */
#mobileMenu{position:fixed;inset:0;z-index:99;background:rgba(253,252,248,0.98);display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px}
#mobileMenu.open{display:flex}
#mobileMenu a{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:300;color:#1A1A1A;text-decoration:none;letter-spacing:4px;text-transform:uppercase}
#mobileMenu a:hover{color:var(--crimson)}

/* ===== HERO ===== */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 20% 50%,rgba(139,26,26,.07) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(201,169,110,.09) 0%,transparent 50%),linear-gradient(180deg,#FDFCF8 0%,#F8F3EC 60%,#F2EAE0 100%)}
.hero-top-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--crimson),transparent)}
.corner{position:absolute;width:40px;height:40px;opacity:.3}
.corner-tl{top:40px;left:20px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner-tr{top:40px;right:20px;border-top:1px solid var(--gold);border-right:1px solid var(--gold)}
.corner-bl{bottom:40px;left:20px;border-bottom:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner-br{bottom:40px;right:20px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
.hero-content{position:relative;z-index:2;text-align:center;padding:100px 24px 80px;max-width:520px;width:100%}
.hero-edition{display:inline-flex;align-items:center;gap:10px;margin-bottom:24px}
.hero-edition-line{width:32px;height:1px;background:var(--gold)}
.hero-edition-text{font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;font-weight:300}
.hero-emblem{width:80px;height:80px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;position:relative;box-shadow:0 0 0 6px rgba(201,169,110,.08),0 0 0 12px rgba(201,169,110,.04)}
.hero-emblem::before{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid #E8D5B0;opacity:.6}
.hero-emblem-char{font-size:28px;color:var(--crimson);font-family:serif;position:relative;z-index:1}
.hero-title{font-family:'Playfair Display',Georgia,serif;font-size:56px;font-weight:300;letter-spacing:8px;color:var(--crimson);margin-bottom:8px}
.hero-fullname{font-size:11px;color:#888;letter-spacing:2px;line-height:1.6;margin-bottom:6px;padding:0 16px;text-transform:uppercase}
.hero-chinese{font-size:12px;color:#AAA;letter-spacing:3px;margin-bottom:24px;font-family:'Cormorant Garamond',Georgia,serif}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 28px;color:var(--gold);font-size:13px}
.ornament-line{height:1px;width:48px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament-line.right{background:linear-gradient(270deg,transparent,var(--gold))}
.hero-tagline{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;color:#444;line-height:1.6;font-style:italic;margin-bottom:36px;padding:0 8px}
.hero-cta{display:inline-flex;align-items:center;gap:10px;background:var(--crimson);color:#fff;padding:15px 32px;font-size:11px;letter-spacing:3px;text-transform:uppercase;text-decoration:none;border-radius:2px;transition:.2s;min-width:260px;justify-content:center}
.hero-cta:hover{background:#6B1313}
.hero-cta svg{flex-shrink:0}
.hero-cta-sub{font-size:11px;color:#AAA;letter-spacing:1px;margin-top:12px;display:block}
.scroll-indicator{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.3}
.scroll-line{width:1px;height:32px;background:var(--gold);animation:scrollAnim 1.6s ease-in-out infinite}
@keyframes scrollAnim{0%,100%{transform:scaleY(1);opacity:.3}50%{transform:scaleY(.5);opacity:.8}}

/* ===== SECTIONS ===== */
section{padding:64px 20px}
.section-inner{max-width:520px;margin:0 auto}
.section-eyebrow{font-size:10px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;text-align:center;display:block;margin-bottom:12px}
.section-title{font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:300;letter-spacing:2px;color:#1A1A1A;text-align:center;margin-bottom:16px;line-height:1.3}

/* ===== EVENT SECTION ===== */
#event{background:#FDFCF8}
.event-desc{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;color:#555;line-height:1.7;text-align:center;margin-bottom:24px;font-weight:300}
.theme-box{border:1px solid var(--light-gold);background:#FDF8F0;border-radius:2px;padding:18px 20px 18px 24px;margin-bottom:24px;position:relative;overflow:hidden}
.theme-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--crimson)}
.theme-label{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.theme-text{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;color:#333;line-height:1.6;font-style:italic}
.info-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.info-card{background:#fff;border:1px solid #F0E8D0;border-radius:3px;padding:14px 8px;text-align:center;box-shadow:0 1px 6px rgba(201,169,110,.08)}
.info-card-icon{font-size:18px;color:var(--gold);margin-bottom:6px}
.info-card-label{font-size:10px;color:#AAA;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.info-card-value{font-size:12px;color:#333;font-weight:500;line-height:1.3}
.highlights{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.highlight{display:flex;align-items:flex-start;gap:14px;background:#fff;border:1px solid #F0E8D0;border-radius:3px;padding:14px;box-shadow:0 1px 8px rgba(201,169,110,.07)}
.highlight-icon{width:36px;height:36px;background:#FDF8F0;border-radius:50%;border:1px solid #E8D5B0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.highlight-title{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:3px}
.highlight-desc{font-size:12px;color:#777;line-height:1.5;font-weight:300}
.contribution-box{border-radius:3px;padding:28px 20px;text-align:center;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--crimson) 0%,#6B1313 100%);box-shadow:0 8px 32px rgba(139,26,26,.25)}
.contribution-box::before,.contribution-box::after{content:'';position:absolute;width:16px;height:16px;border-color:rgba(201,169,110,.5);border-style:solid}
.contribution-box::before{top:12px;left:12px;border-width:1px 0 0 1px}
.contribution-box::after{bottom:12px;right:12px;border-width:0 1px 1px 0}
.contribution-label{font-size:10px;letter-spacing:4px;color:#E8D5B0;text-transform:uppercase;margin-bottom:8px}
.contribution-amount{font-family:'Playfair Display',Georgia,serif;font-size:40px;font-weight:300;color:#fff;margin-bottom:4px}
.contribution-note{font-size:11px;color:#E8D5B0;opacity:.8}

/* ===== WHY RSVP ===== */
#why{background:#F8F3EC}
.why-intro{font-size:14px;color:#666;text-align:center;line-height:1.7;margin-bottom:28px}
.why-points{display:flex;flex-direction:column;gap:12px}
.why-point{display:flex;gap:14px;background:#fff;border:1px solid #F0E8D0;border-radius:3px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.why-num{width:28px;height:28px;background:var(--crimson);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'Playfair Display',serif;flex-shrink:0}
.why-point-title{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:3px}
.why-point-desc{font-size:12px;color:#777;line-height:1.5;font-weight:300}

/* ===== HOW IT WORKS ===== */
#how{background:#FDFCF8}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:16px;position:relative;padding-bottom:20px}
.step:last-child{padding-bottom:0}
.step-left{display:flex;flex-direction:column;align-items:center}
.step-num{width:32px;height:32px;background:var(--crimson);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'Playfair Display',serif;flex-shrink:0;position:relative;z-index:1}
.step-line{width:1px;flex:1;background:linear-gradient(180deg,var(--light-gold),transparent);margin-top:4px}
.step:last-child .step-line{display:none}
.step-title{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:4px;padding-top:6px}
.step-desc{font-size:12px;color:#777;line-height:1.5}

/* ===== RSVP FORM ===== */
#rsvp{background:#F8F3EC}
.form-card{background:#fff;border:1px solid #E8D5B0;border-radius:4px;padding:28px 24px;box-shadow:0 4px 24px rgba(0,0,0,.05)}
.form-subtitle{font-size:13px;color:#888;text-align:center;margin-bottom:24px;line-height:1.6}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:11px 14px;border:1px solid #E0D5C0;border-radius:2px;font-size:14px;color:#333;background:#FDFCF8;outline:none;transition:.2s;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{border-color:var(--gold);background:#fff}
.form-group .error-msg{font-size:11px;color:#B91C1C;margin-top:4px;display:none}
.radio-group{display:flex;flex-direction:column;gap:8px}
.radio-label{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 14px;border:1px solid #E0D5C0;border-radius:2px;transition:.2s;font-size:13px;color:#555}
.radio-label:hover{border-color:var(--gold)}
.radio-label input{width:auto;margin:0}
.btn-submit{width:100%;padding:14px;background:var(--crimson);color:#fff;border:none;border-radius:2px;font-size:12px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.2s;margin-top:8px;font-family:inherit}
.btn-submit:hover{background:#6B1313}
.btn-submit:disabled{opacity:.6;cursor:not-allowed}
.form-error{background:#FEE2E2;border:1px solid #FCA5A5;border-radius:2px;padding:12px 14px;font-size:12px;color:#B91C1C;margin-top:12px;display:none}
.success-box{text-align:center;padding:32px 16px;display:none}
.success-icon{width:56px;height:56px;background:#D1FAE5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:22px;color:#065F46}
.success-title{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:300;color:#1A1A1A;margin-bottom:12px}
.success-desc{font-size:13px;color:#666;line-height:1.7;margin-bottom:20px}
.btn-status{display:inline-block;padding:10px 24px;border:1px solid var(--crimson);color:var(--crimson);border-radius:2px;text-decoration:none;font-size:11px;letter-spacing:3px;text-transform:uppercase;transition:.2s}
.btn-status:hover{background:var(--crimson);color:#fff}

/* ===== LISTE PARTICIPANTS ===== */
#participants{background:#FDFCF8}
.plist-count{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
.plist-count strong{color:var(--crimson)}
.plist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.plist-item{background:#fff;border:1px solid #F0E8D0;border-radius:3px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.plist-name{font-size:13px;color:#1A1A1A;font-weight:500}
.plist-city{font-size:11px;color:#AAA;margin-top:2px}
.pbadge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;letter-spacing:1px;font-weight:500;white-space:nowrap}
.pbadge-pending{background:#FEF3C7;color:#92400E}
.pbadge-validated{background:#D1FAE5;color:#065F46}
.pbadge-invited{background:#DBEAFE;color:#1E40AF}
.plist-empty{text-align:center;padding:32px;color:#AAA;font-size:13px}
.plist-loading{text-align:center;padding:32px;color:#AAA;font-size:13px}

/* ===== FOOTER ===== */
footer{background:#1A1A1A;color:#fff;padding:48px 24px}
.footer-inner{max-width:520px;margin:0 auto;text-align:center}
.footer-logo{width:40px;height:40px;border:1px solid var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:18px;color:var(--gold)}
.footer-name{font-family:'Playfair Display',Georgia,serif;font-size:13px;font-weight:300;color:#CCC;letter-spacing:3px;margin-bottom:4px}
.footer-sub{font-size:11px;color:#666;letter-spacing:2px;margin-bottom:24px}
.footer-divider{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px}
.footer-divider-line{height:1px;width:48px;background:#333}
.footer-divider-dot{width:3px;height:3px;border-radius:50%;background:var(--gold)}
.footer-copy{font-size:11px;color:#555;letter-spacing:1px}

/* ===== REVEAL ANIMATION ===== */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.visible{opacity:1;transform:none}
.reveal-left{opacity:0;transform:translateX(-20px);transition:opacity .6s ease,transform .6s ease}
.reveal-left.visible{opacity:1;transform:none}

/* ===== UTILITIES ===== */
@media(max-width:400px){
  .hero-title{font-size:42px;letter-spacing:5px}
  .info-cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-inner">
    <a href="#" class="nav-logo">
      <div class="nav-logo-icon">中</div>
      <span class="nav-logo-text">ACTILC</span>
    </a>
    <div class="nav-links">
      <a href="#event" data-i18n="nav.event"></a>
      <a href="#why" data-i18n="nav.why"></a>
      <a href="#rsvp" data-i18n="nav.rsvp"></a>
      <a href="#participants" data-i18n="nav.participants"></a>
      <a href="rsvp-status.html" data-i18n="nav.status"></a>
    </div>
    <div class="nav-right">
      <div class="lang-btns">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="zh">中</button>
      </div>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- MOBILE MENU -->
<div id="mobileMenu">
  <a href="#event" class="menu-link" data-i18n="nav.event"></a>
  <a href="#why" class="menu-link" data-i18n="nav.why"></a>
  <a href="#rsvp" class="menu-link" data-i18n="nav.rsvp"></a>
  <a href="#participants" class="menu-link" data-i18n="nav.participants"></a>
  <a href="rsvp-status.html" class="menu-link" data-i18n="nav.status"></a>
  <div class="lang-btns" style="margin-top:16px">
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="zh">中</button>
  </div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="hero-top-line"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>
  <div class="hero-content">
    <div class="hero-edition reveal">
      <div class="hero-edition-line"></div>
      <span class="hero-edition-text" data-i18n="hero.subtitle"></span>
      <div class="hero-edition-line"></div>
    </div>
    <div class="hero-emblem reveal" style="transition-delay:.15s">
      <span class="hero-emblem-char">中</span>
    </div>
    <h1 class="hero-title reveal" style="transition-delay:.3s">ACTILC</h1>
    <p class="hero-fullname reveal" style="transition-delay:.4s" data-i18n="hero.titleFull"></p>
    <p class="hero-chinese reveal" style="transition-delay:.5s" data-i18n="hero.chinese"></p>
    <div class="ornament reveal" style="transition-delay:.55s">
      <div class="ornament-line"></div>
      <span>✦</span>
      <div class="ornament-line right"></div>
    </div>
    <p class="hero-tagline reveal" style="transition-delay:.6s">« <span data-i18n="hero.tagline"></span> »</p>
    <div class="reveal" style="transition-delay:.75s">
      <a href="#rsvp" class="hero-cta">
        <span data-i18n="hero.cta"></span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 7h12M8 2l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <span class="hero-cta-sub" data-i18n="hero.ctaSub"></span>
    </div>
  </div>
  <div class="scroll-indicator"><div class="scroll-line"></div></div>
</section>

<!-- EVENT -->
<section id="event">
  <div class="section-inner">
    <span class="section-eyebrow reveal" data-i18n="event.eyebrow"></span>
    <h2 class="section-title reveal" data-i18n="event.title"></h2>
    <div class="ornament reveal"><div class="ornament-line"></div><span>✦</span><div class="ornament-line right"></div></div>
    <p class="event-desc reveal" data-i18n="event.description"></p>
    <div class="theme-box reveal">
      <p class="theme-label" data-i18n="event.themeLabel"></p>
      <p class="theme-text">« <span data-i18n="event.theme"></span> »</p>
    </div>
    <div class="info-cards reveal">
      <div class="info-card">
        <div class="info-card-icon">◷</div>
        <div class="info-card-label" data-i18n="event.dateLabel"></div>
        <div class="info-card-value" data-i18n="event.date"></div>
      </div>
      <div class="info-card">
        <div class="info-card-icon">◎</div>
        <div class="info-card-label" data-i18n="event.timeLabel"></div>
        <div class="info-card-value" data-i18n="event.time"></div>
      </div>
      <div class="info-card">
        <div class="info-card-icon">◇</div>
        <div class="info-card-label" data-i18n="event.locationLabel"></div>
        <div class="info-card-value" data-i18n="event.location"></div>
      </div>
    </div>
    <div class="highlights">

// Detect language
function detectLang() {
  const saved = localStorage.getItem('actilc_lang');
  if (saved) return saved;
  const nav = (navigator.language || navigator.userLanguage || 'fr').toLowerCase();
  if (nav.startsWith('zh')) return 'zh';
  if (nav.startsWith('en')) return 'en';
  return 'fr';
}

let currentLang = detectLang();

function t(key) { return TRANSLATIONS[currentLang][key] || TRANSLATIONS.fr[key] || key; }

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const val = t(el.dataset.i18n);
    if (typeof val === 'string') el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPlaceholder);
  });

  // Build steps
  const steps = t('how.steps');
  const container = document.getElementById('stepsContainer');
  if (container && Array.isArray(steps)) {
    container.innerHTML = steps.map((s,i) => `
      <div class="step reveal" style="transition-delay:${i*0.07}s">
        <div class="step-left">
          <div class="step-num">${i+1}</div>
          <div class="step-line"></div>
        </div>
        <div style="padding-bottom:8px">
          <div class="step-title">${s.t}</div>
          <div class="step-desc">${s.d}</div>
        </div>
      </div>`).join('');
    initReveal();
  }

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === currentLang);
  });

  // Success texts (pre-populate)
  document.querySelectorAll('#formSuccess [data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('actilc_lang', lang);
  applyTranslations();
  // Re-run reveal for newly rendered elements
  setTimeout(initReveal, 50);
}

// Lang buttons
document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

// Navbar scroll

window.addEventListener('scroll', () => {
  navbar.classList.toggle('scrolled', window.scrollY > 50);
}, {passive:true});

// Hamburger

const menu = document.getElementById('mobileMenu');
ham.addEventListener('click', () => menu.classList.toggle('open'));
document.querySelectorAll('.menu-link').forEach(l => {
  l.addEventListener('click', () => menu.classList.remove('open'));
});
menu.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => { setLang(b.dataset.lang); menu.classList.remove('open'); });
});

// Scroll reveal
function initReveal() {
  const els = document.querySelectorAll('.reveal, .reveal-left');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
  }, {threshold:.12});
  els.forEach(el => {
    if (el.classList.contains('visible')) return;
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight && rect.bottom > 0) {
      el.classList.add('visible');
    } else {
      obs.observe(el);
    }
  });
}

// RSVP Form
const API_BASE = document.currentScript ? new URL(document.currentScript.src).origin + '/china' : '';
// Try to determine API base from current URL
function getApiBase() {
  const url = new URL(window.location.href);
  const parts = url.pathname.split('/').filter(Boolean);
  // Find 'china' in path or use root
  const chinaIdx = parts.indexOf('china');
  if (chinaIdx !== -1) {
    return url.origin + '/' + parts.slice(0, chinaIdx+1).join('/');
  }
  return url.origin + url.pathname.replace(/\/[^/]*$/, '');
}
const BASE = getApiBase();

document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearErrors();

  const fullName     = document.getElementById('fullName').value.trim();
  const email        = document.getElementById('email').value.trim();
  const phone        = document.getElementById('phone').value.trim();
  const translatorId = document.getElementById('translatorId').value.trim();
  const city         = document.getElementById('city').value.trim();
  const participates = document.querySelector('input[name="participates"]:checked').value === '1';
  const comment      = document.getElementById('comment').value.trim();

  let valid = true;
  if (!fullName)     { showError('fullName'); valid = false; }
  if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) { showError('email'); valid = false; }
  if (!translatorId) { showError('translatorId'); valid = false; }
  if (!valid) return;

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true;
  btn.querySelector('[data-i18n]').textContent = t('form.submitting');

  try {
    const r = await fetch(`${BASE}/api/rsvp.php`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({fullName,email,phone,translatorId,city,participates,comment})
    });
    const d = await r.json();
    if (r.ok) {
      document.getElementById('rsvpForm').style.display = 'none';
      const sBox = document.getElementById('formSuccess');
      sBox.style.display = 'block';
      sBox.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
    } else if (r.status === 409) {
      showFormError(t('form.duplicate'));
    } else {
      showFormError(t('form.error'));
    }
  } catch {
    showFormError(t('form.error'));
  }
  btn.disabled = false;
  btn.querySelector('[data-i18n]').textContent = t('form.submit');
});

function showError(id) { document.getElementById('err-'+id).style.display='block'; }
function clearErrors() { document.querySelectorAll('.error-msg').forEach(e => e.style.display='none'); }
function showFormError(msg) { const el = document.getElementById('formError'); el.textContent=msg; el.style.display='block'; }

// Footer year
document.getElementById('year').textContent = new Date().getFullYear();

// Participant list
async function loadPublicList() {
  try {
    const r = await fetch(`${BASE}/api/public-list.php`);
    if (!r.ok) return;
    const d = await r.json();
    const countEl = document.getElementById('plistCount');
    const gridEl  = document.getElementById('plistGrid');
    const countFn = TRANSLATIONS[currentLang]['plist.count'] || TRANSLATIONS.fr['plist.count'];
    countEl.innerHTML = countFn(d.total);
    if (!d.participants.length) {
      gridEl.innerHTML = `<div class="plist-empty">${t('plist.empty')}</div>`;
      return;
    }
    const badges = {
      pending:   ['pbadge-pending',   'pbadge.pending'],
      validated: ['pbadge-validated', 'pbadge.validated'],
      invited:   ['pbadge-invited',   'pbadge.invited'],
    };
    gridEl.innerHTML = d.participants.map(p => {
      const [cls, key] = badges[p.status] || ['pbadge-pending','pbadge.pending'];
      return `<div class="plist-item">
        <div>
          <div class="plist-name">${p.full_name}</div>
          ${p.city ? `<div class="plist-city">${p.city}</div>` : ''}
        </div>
        <span class="pbadge ${cls}">${t(key)}</span>
      </div>`;
    }).join('');
    initReveal();
  } catch(e) {}
}

// Init
applyTranslations();
setTimeout(initReveal, 50);
loadPublicList();
